services:
  api-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: api-portal:latest
    container_name: api-portal
    restart: unless-stopped
    ports:
      - "127.0.0.1:3401:3401"
    environment:
      # Required for access from outside the container.
      HOST: 0.0.0.0
      PORT: 3401

      # Provider and access configuration.
      UPSTREAM_BASE: ${UPSTREAM_BASE}
      UPSTREAM_KEY: ${UPSTREAM_KEY}
      CLIENT_KEYS: ${CLIENT_KEYS:-}
      PASSTHROUGH: ${PASSTHROUGH:-1}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      STATUS_URL: ${STATUS_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      PORTAL_NAME: ${PORTAL_NAME:-API PORTAL}

      # Limits and billing.
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-104857600}
      PORTAL_LOGIN_MAX_ATTEMPTS: ${PORTAL_LOGIN_MAX_ATTEMPTS:-10}
      PORTAL_LOGIN_WINDOW_MS: ${PORTAL_LOGIN_WINDOW_MS:-60000}
      PORTAL_LOGIN_BUCKETS_MAX: ${PORTAL_LOGIN_BUCKETS_MAX:-5000}
      PORTAL_LOGIN_BODY_BYTES: ${PORTAL_LOGIN_BODY_BYTES:-16384}
      PORTAL_SESSION_TTL_MS: ${PORTAL_SESSION_TTL_MS:-43200000}
      PORTAL_SESSION_MAX: ${PORTAL_SESSION_MAX:-5000}
      CREDITS_PER_USD: ${CREDITS_PER_USD:-10000}

      # Optional provider dashboard telemetry.
      UPSTREAM_DASHBOARD_TOKEN: ${UPSTREAM_DASHBOARD_TOKEN:-}
      UPSTREAM_SESSION: ${UPSTREAM_SESSION:-}
      UPSTREAM_SESSION_USER: ${UPSTREAM_SESSION_USER:-}

      # Optional paths inside the container. Mount matching files if used.
      PUBLIC_DIR: ${PUBLIC_DIR:-/app/public}
      NEWS_FILE: ${NEWS_FILE:-/app/news.json}
